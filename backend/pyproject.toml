[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow backend — CQRS + Outbox + gRPC streaming, modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "motor>=3.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "grpcio>=1.66",
    "grpcio-tools>=1.66",
    "protobuf>=5.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres,mongodb]>=4.8",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Points basedpyright/pyright at the local venv (create with `python -m venv
# .venv` in this folder, then `pip install -e ".[dev]"`) — dependencies live
# in the Docker image, not on the host, so without this the editor's Python
# language server can't resolve any of them (sqlalchemy, grpcio, etc.).
[tool.basedpyright]
venvPath = "."
venv = ".venv"
